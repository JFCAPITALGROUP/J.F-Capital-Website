<header class="topbar"><div class="wrap">
<a class="brand" href="index.html" aria-label="J.F. Capital Group home"><img src="assets/logo.png" alt="JFCG logo"></a>
<nav class="nav" aria-label="Main"><a class="btn" href="index.html">About</a><a class="btn" href="ventures.html">Ventures</a><a class="btn" href="team.html">Team</a><a class="btn active" href="contact.html" aria-current="page">Contact Us</a></nav>

<main>
<div class="wrap page-head">
<h1>Contact us</h1>
<p class="lede">Send us a message and we will get back to you.</p>
</div>
<section class="block"><div class="wrap">
<form action="https://formspree.io/f/xdegyyen" method="POST">
<div class="row">
<label>First name<input type="text" name="first_name" autocomplete="given-name" required></label>
<label>Last name<input type="text" name="last_name" autocomplete="family-name" required></label>
</div>
<label>Email address<input type="email" name="email" autocomplete="email" required></label>
<label>Phone number<input type="tel" name="phone" autocomplete="tel"></label>
<label>Message<textarea name="message" required></textarea></label>
<input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
<input type="hidden" name="_subject" value="New message from the J.F. Capital Group website">
<div><button class="btn primary" type="submit">Send message</button></div>
</form>
<div class="contact-side">
<h3>Looking for The Tire Guy?</h3>
<p>For tire orders and support, email <a href="mailto:support@thetireguy.shop">support@thetireguy.shop</a>.</p>
</div>
</div></section>
</main>
